  <style>
    /* Cinematic IMAX & Film Flare Styling */
    body {
      background-color: #040508;
      background-image: 
        radial-gradient(ellipse 90% 40% at 50% 0%, rgba(245, 158, 11, 0.08), transparent 70%),
        radial-gradient(ellipse 70% 30% at 50% 100%, rgba(6, 182, 212, 0.07), transparent 70%);
      background-attachment: fixed;
    }

    .glass-cine {
      background: rgba(13, 17, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.15);
    }

    .glass-card {
      background: rgba(20, 26, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .anamorphic-line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(245, 158, 11, 0.8) 50%, transparent 100%);
    }

    .anamorphic-line-teal {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(6, 182, 212, 0.8) 50%, transparent 100%);
    }

    #canvas3d-container {
      cursor: grab;
      touch-action: none;
    }
    #canvas3d-container:active {
      cursor: grabbing;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #040508;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }

    @keyframes pulseAura {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.02); }
    }
    .cine-pulse {
      animation: pulseAura 4s infinite ease-in-out;
    }
  </style>
</head>

  <!-- TOP CINEMATIC HUD BAR -->
  <header class="sticky top-0 z-40 glass-cine border-b border-cine-border shadow-2xl">

      <div class="flex items-center space-x-3">

          <i class="ph-fill ph-atom text-amber-300 text-2xl"></i>
          <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>

          </span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-cinzel font-bold text-sm sm:text-base tracking-widest uppercase text-white flex items-center gap-2">

            </h1>
            <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">v3.0 EXT</span>
          </div>
          <div id="liveHUDClock" class="text-[11px] font-mono text-slate-400 flex items-center gap-2">
            <i class="ph ph-satellite text-teal-400"></i> SYNCHRONIZING REALTIME ORBITS...
          </div>
        </div>
      </div>

      <!-- Quick Actions -->

          <span id="pwaInstallBtnText" class="hidden sm:inline">INSTALL PWA</span>
        </button>

        <!-- Sentinel Briefing Launcher -->
        <button onclick="triggerDebriefHUD(true)" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-mono font-bold bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-anamorphic-amber transition">

          <span class="hidden sm:inline">WHAT HAPPENED?</span>
        </button>

          <span class="hidden sm:inline">DAY PREP</span>
